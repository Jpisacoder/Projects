<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {  
          width: 100vw;
          height: 100vh;
          background-color: aliceblue;
          background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(151, 145, 145, 0.8));
          margin:0;
          display: flex;
          justify-content: center;
          align-items: center;
          position: relative;
        }
         h1 {
          font-family: "Pacifico", cursive;
          font-size: 50px;
          color: #fff5ee;
        } 
        .hero-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; 
            height: 200px;
            opacity: 0.6; 
            border-radius: 50%; 
            object-fit: cover;
            
        }
    </style>
</head>

<body>
    <!-- Audio element, set to loop -->
    <audio id="background-audio" loop>
        <source src="./Death Note - Ls Theme.mp3" type="audio/mp3">
    </audio>

    <div class="px-4 py-5 my-5 text-center">
        <img class="d-block mx-auto mb-4" src="./busyman.png" alt="" width="200" height="200">
        <h1 class="display-5 fw-bold text-body-emphasis">JP'S PORTFOLIO</h1>
        <div class="col-lg-6 mx-auto">
          <p class="lead mb-4">Hey there! My name is Joao Pedro Neves and I'm a beginner coder who goes by JP. Hopefully, you will be impressed by my code so far through this portfolio. 😁</p>
          <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="./AboutMe.html">
              <button type="button" class="btn btn-outline-secondary btn-lg px-4">About Me</button>
            </a>
            
            <a href="https://github.com/Jpisacoder/Projects" target="_blank">
              <button type="button" class="btn btn-outline-secondary btn-lg px-4">My code</button>
              </a>
            <a href="./Socials.html">
            <button type="button" class="btn btn-outline-secondary btn-lg px-4">My socials</button>
            </a>
          </div>
          
          <button id="play-theme" class="btn btn-outline-secondary btn-lg mt-4 px-5">Play My Theme Song</button>
        </div>
      </div>

    <script>
        // Get the audio element and the button
        const audio = document.getElementById('background-audio');
        const playButton = document.getElementById('play-theme');

        // Add an event listener to the button to toggle play/pause
        playButton.addEventListener('click', () => {
            // If the audio is paused, play it; otherwise, pause it
            if (audio.paused) {
                audio.play();
                playButton.textContent = "Pause My Theme Song"; // Change button text to "Pause"
            } else {
                audio.pause();
                playButton.textContent = "Play My Theme Song"; // Change button text to "Play"
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./mouseAnimation.js"></script>
    
</body>
</html>
